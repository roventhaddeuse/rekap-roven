<style>
/* Aplikasi satu kolom ala HP: bilah atas bulan, isi bertab, navigasi bawah. Warna dingin netral, aksen hijau tua. */
:root {

    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-nav: 0 10px 30px rgba(0,0,0,.55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --outer: #07090c; --bg: #0e1116; --surface: #171b22; --surface2: #1f242d; --fg: #eceff4; --muted: #98a2b3; --line: #2a303b;
  --accent: #34d1bf; --accent-fg: #06201c; --accent-soft: #12312d; --warn: #f79009; --bad: #f97066; --ok: #47cd89;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-nav: 0 10px 30px rgba(0,0,0,.55); color-scheme: dark;

* { box-sizing: border-box; }

.nav { position: fixed; bottom: calc(.625rem + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(calc(100% - 32px), 28rem); z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); gap: .25rem; background: color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 1.5rem; padding: .375rem; box-shadow: var(--shadow-nav); }

.btn.sec2 { background: var(--surface2); color: var(--fg); }

.btn:disabled { opacity: .45; cursor: not-allowed; }

select.fld { -webkit-appearance: none; appearance: none; padding-right: 2.25rem; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 1.1rem) 52%, calc(100% - .8rem) 52%; background-size: .3rem .3rem; background-repeat: no-repeat; text-overflow: ellipsis; }

<script>
/* Pengganti layanan Claude: data di HP (localStorage), baca foto lewat Gemini dengan kunci milik pengguna. */
(() => {
  const KEY_DB = 'rekap_db_v1', KEY_API = 'rekap_gemini_key', KEY_MODEL = 'rekap_gemini_model';
  const SEED = {"v": 1, "db": {}};
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } } };
  let store = null;
  try { store = JSON.parse(ls.get(KEY_DB) || 'null'); } catch (e) { store = null; }
  if (!store || typeof store !== 'object') { store = SEED.db; ls.set(KEY_DB, JSON.stringify(store)); }
  const subs = [];
  const persist = () => { if (!ls.set(KEY_DB, JSON.stringify(store))) throw new Error('storage'); subs.forEach((f) => f()); };
  const snapDoc = (p) => ({ exists: p in store, id: p.split('/').pop(), data: () => JSON.parse(JSON.stringify(store[p])) });
  const db = {
    doc(p) { return {
      set: async (v) => { store[p] = JSON.parse(JSON.stringify(v)); persist(); },
      delete: async () => { delete store[p]; persist(); },
      onSnapshot(cb) { const f = () => cb(snapDoc(p)); subs.push(f); setTimeout(f, 0); return () => {}; },
    }; },
    collection(c) { return {
      onSnapshot(cb) { const f = () => cb({ docs: Object.keys(store).filter((k) => k.startsWith(c + '/') && k.split('/').length === 2).map(snapDoc) }); subs.push(f); setTimeout(f, 0); return () => {}; },
    }; },
  };
  const toB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
      return { mime: 'image/jpeg', data: await toB64(blob) };
    } catch (e) { return { mime: file.type || 'image/jpeg', data: await toB64(file) }; }
  }
  const err = (code, msg) => Object.assign(new Error(msg || code), { code, userMsg: msg });
  async function askGemini(prompt, img, signal) {
    const key = (ls.get(KEY_API) || '').trim();
    if (!key) throw err('no_key', 'Kunci Gemini belum diisi. Isi dulu di bagian Pengaturan di bawah.');
    const model = (ls.get(KEY_MODEL) || 'gemini-flash-latest').trim();
    let r;
    try {
      r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
        method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }, { inline_data: { mime_type: img.mime, data: img.data } }] }], generationConfig: { temperature: 0, responseMimeType: 'application/json' } }),
      });
    } catch (e) { if (e && e.name === 'AbortError') throw err('cancelled'); throw err('net', 'Tidak ada koneksi internet. Periksa sinyal lalu coba lagi.'); }
    let j = null; try { j = await r.json(); } catch (e) { j = null; }
    if (!r.ok) {
      const m = (j && j.error && j.error.message) || '';
      if (r.status === 429) throw err('quota', 'Kuota gratis Gemini habis untuk saat ini. Coba lagi beberapa menit lagi, atau besok.');
      if (r.status === 400 && /api key/i.test(m)) throw err('key', 'Kunci Gemini tidak valid. Periksa lagi kunci di Pengaturan.');
      if (r.status === 403) throw err('key', 'Kunci Gemini ditolak. Pastikan kunci benar dan Gemini API aktif di akun Google Anda.');
      if (r.status === 404) throw err('model', 'Model "' + model + '" tidak ditemukan. Ganti nama model di Pengaturan.');

    }
    const txt = ((((j || {}).candidates || [])[0] || {}).content || {}).parts ? j.candidates[0].content.parts.map((p) => p.text || '').join('') : '';

  const sample = {
    limits: async () => ({ images: { maxCount: 12 } }),
    async json(prompt, opt) {
      const out = { baris: [], dilewati: [], catatan: [] };
      const imgs = opt.images || [];
      for (let i = 0; i < imgs.length; i++) {
        if (window.__rekapProgress) window.__rekapProgress(i + 1, imgs.length);
        const res = await askGemini(prompt, await shrink(imgs[i]), opt.signal);
        if (res && Array.isArray(res.baris)) out.baris.push(...res.baris);
        if (res && Array.isArray(res.dilewati)) out.dilewati.push(...res.dilewati);
        if (res && res.catatan) out.catatan.push((imgs.length > 1 ? 'Foto ' + (i + 1) + ': ' : '') + res.catatan);

    },

  async function save({ filename, data }) {
    const blob = data instanceof Blob ? data : new Blob([data]);

<script>
(() => {
  const MEREK = [

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (q) => document.querySelector(q);
  const pad2 = (n) => String(n).padStart(2, '0');
  const today = new Date();
  const todayYM = today.getFullYear() + '-' + pad2(today.getMonth() + 1);
  const todayISO = todayYM + '-' + pad2(today.getDate());
  const ymLabel = (ym) => BLN[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4);
  const ymShift = (ym, d) => { const dt = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + d, 1); return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1); };
  const dLabel = (iso) => Number(iso.slice(8, 10)) + ' ' + BLN[Number(iso.slice(5, 7)) - 1];
  const mInfo = (k) => MEREK.find((m) => m.k === k) || { k, n: k, c: 'var(--muted)' };

  const ICON = {
    ringkas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    toko: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></svg>',
    nota: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>',
    foto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',

  };

  const S = {
    ym: todayYM, tab: 'ringkas', grup: 'all', q: '', belum: false, tutup: {}, imp: null,

  function calc() {

  // hari kerja (Senin sampai Sabtu) dari hari ini sampai akhir bulan; hanya untuk bulan berjalan

    if (ym !== todayYM) return null;

    const last = new Date(y, m, 0).getDate();
    let n = 0;
    for (let d = today.getDate(); d <= last; d++) if (new Date(y, m - 1, d).getDay() !== 0) n++;
    return n;
  }
  function paceHTML(t, total) {
    if (!t) return '';

    if (!hari) return '<span>kurang <b>' + fmt(kurang) + '</b></span>';

    const pct = pv ? ' (' + sign + Math.round(Math.abs(total - pv) / pv * 100) + '%)' : '';
    return '<div class="m-sub"><span>' + esc(ymLabel(c.pym)) + ' <b>' + fmt(pv) + '</b>' + (S.ym === todayYM ? ' sebulan penuh' : '') + '</span><span class="delta ' + (up ? 'up' : 'down') + '">' + sign + fmt(Math.abs(total - pv)) + pct + '</span></div>';
  }

  /* ---------- tampilan ---------- */
  function render() {
    const app = $('#app');
    if (!app) return;

    app.innerHTML =
      '<div class="pad top"><div class="brand">Rekap Roven<small>' + (S.toko.length ? S.toko.length + ' toko kunjungan' : 'Area penjualan') + '</small></div>' +
      '<div class="month"><button data-a="prev" aria-label="Bulan sebelumnya">‹</button><b>' + esc(ymLabel(S.ym)) + '</b><button data-a="next" aria-label="Bulan berikutnya">›</button></div></div>' +
      '<div class="pad stack">' + body + '</div>' +
      '<nav class="nav" aria-label="Menu">' +
      [['ringkas', 'Ringkasan'], ['toko', 'Toko'], ['nota', 'Nota'], ['foto', 'Foto']].map(([k, l]) =>
        '<button data-a="tab" data-t="' + k + '"' + (S.tab === k ? ' aria-current="page"' : '') + '>' + ICON[k] + l + '</button>').join('') +
      '</nav>';
    if (S.tab === 'toko') { drawTokoList(); if (fq) { const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } } }
  }

  function viewKosong() {
    return '<div class="card empty"><b>Data belum ada di HP ini</b>Buka tab Foto, gulir ke Pengaturan, tekan Pulihkan, lalu pilih file Data-Rekap-Roven.json.</div><button class="btn" data-a="tab" data-t="foto">Buka Pengaturan</button>';
  }

  function viewOffline() {
    return '<div class="card empty"><b>Data belum bisa dibuka</b>Penyimpanan di HP ini tidak bisa dipakai. Matikan mode Private di Safari, lalu buka lagi.</div>';
  }

  function viewRingkas() {
    const c = calc();
    const nToko = S.toko.length;
    const belum = Math.max(0, nToko - c.sudah.size);
    let h = '<div class="card hero">' +
      '<div><div class="k">Nota masuk</div><div class="v">' + fmt(c.notas.length) + '</div></div>' +
      '<div><div class="k">Toko order</div><div class="v">' + fmt(c.sudah.size) + '<span style="font-size:1rem;font-weight:600;opacity:.75"> / ' + fmt(nToko) + '</span></div></div>' +

    h += '<div class="sec"><h2>Total per merek</h2><button class="link" data-a="target">Atur target</button></div>';
    h += '<div class="card list">';
    MEREK.forEach((m) => {
      const t = Number(c.tgt[m.k]) || 0;
      const total = c.tot[m.k] || 0;
      const p = t ? total / t : null;
      const nT = c.orderToko[m.k] ? c.orderToko[m.k].size : 0;
      const zero = !total && !t;
      h += '<button class="b' + (zero ? ' zero' : '') + '" data-a="merek" data-k="' + m.k + '" aria-label="Lihat penjualan ' + esc(m.n) + '">' +

        (p == null ? '' : '<span class="pill ' + (p >= 1 ? 'ok' : p >= .5 ? '' : 'warn') + '">' + pf(p) + '</span>') +

      h += '</button>';

    h += '</div>';

  function viewNota() {

    let h = '<div class="card drop">' + ICON.foto +

      '<label class="lbl" style="width:100%;max-width:16rem;text-align:left">Tanggal nota di foto<input class="fld" type="date" id="scanTgl" value="' + esc(S.scanTgl) + '"></label>' +
      '<div class="chips" style="justify-content:center"><button class="chip" data-a="tglSet" data-v="' + ydISO + '" aria-pressed="' + (S.scanTgl === ydISO) + '">Kemarin</button><button class="chip" data-a="tglSet" data-v="' + todayISO + '" aria-pressed="' + (S.scanTgl === todayISO) + '">Hari ini</button><button class="chip" data-a="tglSet" data-v="" aria-pressed="' + (!S.scanTgl) + '">Baca dari buku</button></div>' +

    h += '<div class="card" style="padding:1rem"><ul class="tips"><li>Satu foto satu halaman, tegak lurus, terang, tidak terpotong.</li><li>Pilih tanggal di atas kalau semua foto dari hari yang sama.</li><li>Hasil selalu Anda periksa dulu sebelum disimpan.</li><li>Foto dikirim ke Gemini (Google) untuk dibaca.</li></ul></div>' +
      '<button class="btn sec2" data-a="manual">Tambah nota manual</button>';
    const key = window.rekapLocal.getKey();
    h += '<div class="sec"><h2>Pengaturan</h2></div><div class="card" style="padding:1rem;display:grid;gap:.75rem">' +
      '<label class="lbl">Kunci Gemini' + (key && !S.keyOpen ? '' : '') + '<input class="fld" id="apiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tempel kunci dari Google AI Studio" value="' + esc(key) + '"></label>' +
      '<p class="note" style="margin:0">' + (key ? 'Kunci tersimpan di HP ini.' : 'Belum ada kunci. Buat gratis di aistudio.google.com, menu Get API key.') + '</p>' +
      '<label class="lbl">Model Gemini<input class="fld" id="apiModel" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(window.rekapLocal.getModel()) + '"></label>' +

      '<p class="note" style="margin:0">' + fmt(window.rekapLocal.count()) + ' nota tersimpan di HP ini. Cadangkan rutin, misalnya tiap Sabtu, dan simpan file-nya di iCloud Drive.</p></div>';

  const FIELDS = [['tanggal', 'Tanggal'], ['nota', 'No. nota'], ['toko', 'Toko'], ['barang', 'Nama barang'], ['q1', 'Jumlah'], ['q2', 'Jumlah ke-2']];
  function viewMap() {
    const im = S.imp, hd = im.head >= 0 ? im.table[im.head] : [];
    const ncol = im.table.slice(0, 300).reduce((n, r) => Math.max(n, r.length), 0);
    const sample = (i) => { for (let r = im.head + 1; r < Math.min(im.table.length, im.head + 40); r++) { const v = cs(im.table[r][i]); if (v) return v; } return ''; };
    const opts = (k) => '<option value="">Tidak ada</option>' + Array.from({ length: ncol }, (_, i) => { const sm = sample(i); return '<option value="' + i + '"' + (im.map[k] === i ? ' selected' : '') + '>' + esc((cs(hd[i]) || 'Kolom ' + (i + 1)) + (sm ? ' · ' + sm.slice(0, 18) : '')) + '</option>'; }).join('');
    const ok = im.map.toko != null && im.map.barang != null && im.map.q1 != null;
    const pv = im.table.slice(im.head + 1, im.head + 6);
    let h = '<div class="card filebox">' + ICON.file + '<div>' + esc(im.name) + '<small>' + fmt(im.table.length - im.head - 1) + ' baris terbaca</small></div></div>' +
      '<div class="sec"><h2>Cocokkan kolom</h2></div>' +
      '<div class="card" style="padding:1rem;display:grid;gap:.75rem">' +
      (im.head < 0 ? '<p class="note">Judul kolom tidak ditemukan. Pilih kolomnya sendiri dari contoh isi.</p>' : '') +
      '<div class="grid2">' + FIELDS.map(([k, l]) => '<label class="lbl">' + l + (k === 'q2' || k === 'tanggal' || k === 'nota' ? ' (opsional)' : '') + '<select class="fld" id="mk-' + k + '" data-mk="' + k + '">' + opts(k) + '</select></label>').join('') + '</div>' +
      '<label class="lbl">Tanggal untuk baris tanpa tanggal<input class="fld" type="date" id="imp-tgl" value="' + esc(im.tgl) + '"></label></div>';
    if (ok && pv.length) h += '<div class="sec"><h2>Contoh isi</h2></div><div class="pv-wrap"><table class="pv"><tr>' + FIELDS.filter(([k]) => im.map[k] != null).map(([, l]) => '<th>' + l + '</th>').join('') + '</tr>' +
      pv.map((r) => '<tr>' + FIELDS.filter(([k]) => im.map[k] != null).map(([k]) => '<td>' + esc(cs(r[im.map[k]]).slice(0, 28)) + '</td>').join('') + '</tr>').join('') + '</table></div>';

    return h;
  }

  function tokoOK(n) { return S.toko.some((t) => t.toko === n); }

  function viewReview() {
    const sc = S.scan;
    const ok = sc.rows.length && sc.rows.every((r) => tokoOK(r.toko) && r.jumlah > 0 && MK.includes(r.merek) && /^\d{4}-\d{2}-\d{2}$/.test(r.tanggal));
    let h = '<div class="sec"><h2>Periksa hasil bacaan</h2><span class="pill">' + sc.rows.length + ' baris</span></div>';
    if (sc.note) h += '<p class="note">' + esc(sc.note) + '</p>';
    if (sc.skipped.length) h += '<p class="note">Dilewati (merek lain): ' + esc(sc.skipped.slice(0, 6).join(', ')) + (sc.skipped.length > 6 ? ' dan ' + (sc.skipped.length - 6) + ' lainnya' : '') + '</p>';
    if (sc.sama) h += '<p class="note">' + fmt(sc.sama) + ' baris sudah tersimpan dengan angka yang sama, jadi dilewati.</p>';
    if (sc.luar && sc.luar.length) h += '<div class="card" style="padding:1rem;display:grid;gap:.5rem"><b>' + fmt(sc.luar.length) + ' baris dari toko di luar daftar kunjungan</b><p class="note">' + esc(Array.from(new Set(sc.luar.map((r) => r.toko_buku))).slice(0, 6).join(', ')) + (sc.luar.length > 6 ? ' dan lainnya' : '') + '. Baris ini tidak disimpan.</p><button class="btn sec2" data-a="luarShow">Tampilkan untuk dipilih tokonya</button></div>';
    if (!sc.rows.length) h += '<div class="card empty"><b>Tidak ada nota baru untuk disimpan</b>Tidak ada baris merek Anda dari toko di daftar kunjungan, atau semuanya sudah tersimpan.</div>';
    sc.rows.forEach((r, i) => {
      const bad = !tokoOK(r.toko);
      const ex = /^\d{4}-\d{2}-\d{2}$/.test(r.tanggal) ? S.nota.find((n) => n.id === rowId(r)) : null;
      const exists = !!ex;
      h += '<div class="card rv' + (bad ? ' miss' : r.ragu ? ' flag' : '') + '" data-i="' + i + '">' +
        '<div class="rv-top"><span>' + (bad ? '<span class="pill bad">Pilih toko</span>' : r.ragu ? '<span class="pill warn">Tulisan kurang jelas, cek</span>' : exists ? '<span class="pill warn">Sudah ada (tersimpan ' + esc(fmt(Number(ex.jumlah) || 0)) + '), akan diganti</span>' : '<span class="pill ok">Baru</span>') + '</span><button class="x" data-a="rowDel" data-i="' + i + '" aria-label="Hapus baris">×</button></div>' +
        (r.toko_buku ? '<div class="note">Di buku: ' + esc(r.toko_buku) + (r.barang ? ' · ' + esc(r.barang) : '') + '</div>' : '') +
        '<label class="lbl">Toko<input class="fld" list="dlToko" data-f="toko" value="' + esc(r.toko) + '" placeholder="Ketik nama toko"></label>' +
        '<div class="grid2"><label class="lbl">Merek<select class="fld" data-f="merek">' + MEREK.map((m) => '<option value="' + m.k + '"' + (m.k === r.merek ? ' selected' : '') + '>' + esc(m.n) + '</option>').join('') + '</select></label>' +
        '<label class="lbl">Jumlah<input class="fld" type="number" inputmode="numeric" min="0" data-f="jumlah" value="' + esc(r.jumlah) + '"></label></div>' +
        '<div class="grid2"><label class="lbl">Tanggal<input class="fld" type="date" data-f="tanggal" value="' + esc(r.tanggal) + '"></label>' +
        '<label class="lbl">No. nota<input class="fld" type="number" inputmode="numeric" data-f="nota" value="' + esc(r.nota == null ? '' : r.nota) + '"></label></div>' +
        '<label style="display:flex;gap:.5rem;align-items:center;font-size:.85rem"><input type="checkbox" data-f="tp"' + (r.tp ? ' checked' : '') + '> Tanpa pajak (TP)</label></div>';
    });
    h += '<button class="btn sec2" data-a="manual">Tambah baris</button>' +
      '<div class="btnrow"><button class="btn sec2" data-a="scanReset">Batal</button><button class="btn" data-a="scanSave"' + (ok ? '' : ' disabled') + '>Simpan semua</button></div>';
    if (!ok && sc.rows.length) h += '<p class="note">Tombol aktif setelah semua toko, jumlah, dan tanggal terisi benar.</p>';
    return h;
  }

  /* ---------- sheet & toast ---------- */
  function openSheet(html) {
    $('#sheet').innerHTML = '<div class="grab"></div>' + html;
    $('#scrim').classList.add('on');
  }
  function closeSheet() { $('#scrim').classList.remove('on'); }
  let toastT;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
  }

  function sheetTarget(focusK) {
    const cur = S.target[S.ym] || {};
    openSheet('<h3>Target ' + esc(ymLabel(S.ym)) + '</h3><p class="sub">Isi jumlah target per merek. Kosongkan jika tidak ada.</p>' +
      MEREK.map((m) => '<label class="lbl"><span><span class="dot" style="display:inline-block;margin-right:.375rem;background:' + m.c + '"></span>' + esc(m.n) + '</span><input class="fld" type="number" inputmode="numeric" min="0" step="5" data-tk="' + m.k + '" value="' + esc(cur[m.k] || '') + '" placeholder="0"></label>').join('') +
      '<div class="btnrow"><button class="btn sec2" data-a="close">Batal</button><button class="btn" data-a="targetSave">Simpan target</button></div>');
    if (focusK) { const el = document.querySelector('[data-tk="' + focusK + '"]'); if (el) el.focus(); }
  }

  function sheetMerek(k) {
    const c = calc();
    const m = mInfo(k);
    const rs = c.notas.filter((n) => n.merek === k).sort((a, b) => (a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : (Number(b.nota) || 0) - (Number(a.nota) || 0)));
    const per = {};
    rs.forEach((n) => { const o = per[n.toko] || (per[n.toko] = { q: 0, c: 0 }); o.q += Number(n.jumlah) || 0; o.c++; });
    const tokoL = Object.entries(per).sort((a, b) => b[1].q - a[1].q);
    const total = c.tot[k] || 0, t = Number(c.tgt[k]) || 0;
    const prev = c.pHas ? ' · ' + esc(ymLabel(c.pym)) + ' ' + fmt(c.ptot[k] || 0) : '';
    openSheet('<h3><span class="dot" style="display:inline-block;margin-right:.5rem;background:' + m.c + '"></span>' + esc(m.n) + '</h3>' +
      '<p class="sub">' + esc(ymLabel(S.ym)) + ' · total <b>' + fmt(total) + '</b>' + (t ? ' dari ' + fmt(t) + ' (' + pf(total / t) + ')' : '') + prev + '</p>' +
      (rs.length ?
        '<div class="sec"><h2>Per toko</h2><span class="pill">' + tokoL.length + ' toko</span></div><div class="card list">' +
        tokoL.map(([nm, o]) => '<button class="row" data-a="toko" data-n="' + esc(nm) + '"><span class="t"><span class="n">' + esc(nm) + '</span><span class="d"><span>' + o.c + ' nota</span></span></span><span class="q">' + fmt(o.q) + '</span></button>').join('') + '</div>' +
        '<div class="sec"><h2>Semua nota</h2><span class="pill">' + rs.length + '</span></div><div class="card list">' +
        rs.map((n) => '<button class="row" data-a="nota" data-id="' + esc(n.id) + '"><span class="t"><span class="n">' + esc(n.toko) + '</span><span class="d"><span>' + esc(dLabel(n.tanggal)) + '</span><span>Nota ' + esc(n.nota == null ? '–' : n.nota) + '</span>' + (n.jenis ? '<span class="pill">' + esc(n.jenis) + '</span>' : '') + '</span></span><span class="q">' + fmt(n.jumlah) + '</span></button>').join('') + '</div>'
        : '<div class="card empty"><b>Belum ada penjualan</b>Tidak ada nota ' + esc(m.n) + ' bulan ini.</div>') +
      '<div class="btnrow"><button class="btn sec2" data-a="target" data-k="' + k + '">Atur target</button><button class="btn sec2" data-a="close">Tutup</button></div>');
  }

  function sheetToko(name) {
    const c = calc();
    const rs = c.notas.filter((n) => n.toko === name).sort((a, b) => (a.tanggal < b.tanggal ? 1 : -1));
    const t = S.toko.find((x) => x.toko === name);
    const pp = c.pPerToko[name];
    const prevHtml = '<p class="note">' + esc(ymLabel(c.pym)) + ': ' + (pp ? MK.filter((k) => pp[k]).map((k) => esc(mInfo(k).n) + ' ' + fmt(pp[k])).join(' · ') : 'tidak ada order') + '</p>';
    openSheet('<h3>' + esc(name) + '</h3><p class="sub">Area ' + (t ? areaOf(t) : '–') + ' · ' + esc(ymLabel(S.ym)) + '</p>' +
      (rs.length ? '<div class="card list">' + rs.map((n) => '<button class="row" data-a="nota" data-id="' + esc(n.id) + '"><span class="dot" style="background:' + mInfo(n.merek).c + '"></span><span class="t"><span class="n">' + esc(mInfo(n.merek).n) + '</span><span class="d"><span>' + esc(dLabel(n.tanggal)) + '</span><span>Nota ' + esc(n.nota == null ? '–' : n.nota) + '</span></span></span><span class="q">' + fmt(n.jumlah) + '</span></button>').join('') + '</div>' : '<div class="card empty"><b>Belum order</b>Tidak ada nota toko ini bulan ini.</div>') +
      prevHtml + '<button class="btn" data-a="addFor" data-n="' + esc(name) + '">Tambah nota toko ini</button><button class="btn sec2" data-a="close">Tutup</button>');
  }

  function sheetNota(id) {
    const n = S.nota.find((x) => x.id === id);
    if (!n) return;
    openSheet('<h3>Nota ' + esc(n.nota == null ? '–' : n.nota) + '</h3><p class="sub">Ubah jika ada yang salah baca.</p>' +
      '<label class="lbl">Toko<input class="fld" list="dlToko" id="e-toko" value="' + esc(n.toko) + '"></label>' +
      '<div class="grid2"><label class="lbl">Merek<select class="fld" id="e-merek">' + MEREK.map((m) => '<option value="' + m.k + '"' + (m.k === n.merek ? ' selected' : '') + '>' + esc(m.n) + '</option>').join('') + '</select></label>' +
      '<label class="lbl">Jumlah<input class="fld" type="number" inputmode="numeric" min="0" id="e-jumlah" value="' + esc(n.jumlah) + '"></label></div>' +
      '<div class="grid2"><label class="lbl">Tanggal<input class="fld" type="date" id="e-tanggal" value="' + esc(n.tanggal) + '"></label>' +
      '<label class="lbl">No. nota<input class="fld" type="number" inputmode="numeric" id="e-nota" value="' + esc(n.nota == null ? '' : n.nota) + '"></label></div>' +
      '<label style="display:flex;gap:.5rem;align-items:center;font-size:.85rem"><input type="checkbox" id="e-tp"' + (n.jenis === 'TP' ? ' checked' : '') + '> Tanpa pajak (TP)</label>' +
      '<button class="btn" data-a="notaSave" data-id="' + esc(id) + '">Simpan</button>' +
      '<div class="btnrow"><button class="btn danger" data-a="notaDel" data-id="' + esc(id) + '">Hapus nota</button><button class="btn sec2" data-a="close">Tutup</button></div>');
  }

  /* ---------- data ---------- */
  function rowId(r) {
    const ym = r.tanggal.slice(0, 7);
    const no = r.nota == null || r.nota === '' ? 'x' + r._u : (r.tp ? 'tp' : 'n') + r.nota;
    return ym + '_' + no + '_' + r.merek;
  }
  const docOf = (r) => ({ ym: r.tanggal.slice(0, 7), tanggal: r.tanggal, nota: r.nota === '' || r.nota == null ? null : Number(r.nota), toko: r.toko, toko_buku: r.toko_buku || '', merek: r.merek, jumlah: Number(r.jumlah), jenis: r.tp ? 'TP' : '', sumber: r.sumber || 'Buku kantor' });

  async function saveRows() {
    const sc = S.scan;
    const rows = sc.rows.slice();
    const alias = Object.assign({}, S.alias);
    let n = 0;
    sc.phase = 'saving'; render();
    try {
      for (const r of rows) {
        await write(() => S.db.doc('nota/' + rowId(r)).set(docOf(r)));
        n++;
        if (r.toko_buku && r.toko_buku.trim()) alias[r.toko_buku.trim().toLowerCase()] = r.toko;
      }
      await write(() => S.db.doc('config/alias').set({ map: alias }));
      S.ym = rows[0] ? rows[0].tanggal.slice(0, 7) : S.ym;
      S.scan = { phase: 'idle', rows: [], skipped: [], note: '', err: '', files: 0 };
      S.tab = 'nota';
      toast(n + ' baris tersimpan');
    } catch (e) {
      sc.phase = 'review';
      sc.err = 'Gagal menyimpan: ' + (e && e.message ? e.message : 'coba lagi');
      toast('Gagal menyimpan');
    }
    render();
  }

  let ctrl = null;
  async function scan(files) {
    const sc = S.scan;
    sc.err = '';
    let sample = null;
    try { sample = await claude.use('sample'); } catch (e) { sample = null; }
    if (!sample) { sc.err = 'Pembaca foto belum siap. Muat ulang aplikasi.'; render(); return; }
    if (!window.rekapLocal.getKey()) { sc.err = 'Isi kunci Gemini dulu di Pengaturan (bawah halaman ini).'; S.keyOpen = true; render(); return; }
    let lim = null;
    try { lim = await sample.limits(); } catch (e) { lim = null; }
    const list = Array.from(files).slice(0, lim.images.maxCount);
    sc.phase = 'busy'; sc.files = list.length; S.prog = ''; render();
    window.__rekapProgress = (i, n) => { S.prog = n > 1 ? 'Foto ' + i + ' dari ' + n : ''; if (S.tab === 'foto' && S.scan.phase === 'busy') render(); };
    ctrl = new AbortController();
    const names = S.toko.map((t) => t.toko).join('\n');
    const alias = Object.entries(S.alias).map(([a, b]) => a + ' => ' + b).join('\n');
    const prompt =
      'Anda membaca foto halaman BUKU PENJUALAN KANTOR (tulisan tangan) milik sebuah distributor bahan bangunan di Kalimantan Selatan. Tahun ' + today.getFullYear() + '.\n' +
      'Kolom buku: Hari & Tanggal (contoh "Kamis 15/10"), No Nota, Customer, L, K (jumlah barang ada di salah satu kolom L atau K), Nama Barang, Harga Satuan, Cash, Credit, Jumlah, Disc.\n' +
      'Satu nota bisa punya beberapa baris barang; tanggal dan nomor nota hanya tertulis di baris pertama. Huruf dalam kurung setelah nama customer seperti (T), (L), (CL) hanya kode pembayaran, bukan bagian nama toko.\n' +
      'AMBIL HANYA baris barang dari merek berikut: Aurora, Infiniti, Granito (granite), Lem Rajawali Hitam (lem; tulis merek "Rajawali"), Sealant Rajawali ("Lem Rajawali Acetic White", "Neutral White", "Neutral Black", "Neutral Clear"; tulis merek "Sealant"; jumlah tulis PERSIS angka pcs di buku, jangan dibagi), ACP, Triplek atau Plywood, Shera. Merek lain (keramik Asia Tile, Platinum, Onda, TACO, Murano, Everest, sanitary dan lainnya) DILEWATI.\n' +
      'Aturan tambahan: Kode berawalan TH, TV, TIX, TIQ, EV, Eco HPL, Eco PVC, TSL, Taco = TACO, dilewati. Nama keramik berakhiran AT, PN, GN, Rec, EMB tanpa kata Aurora/Infiniti/Granito = dilewati. Kode "AA FPE", "AA PE", "AA HDPE", "BA PE", "BA FPE" = ACP. "Lem Rajawali PVC" dan "Lem Rajawali Ultra Glue" BUKAN Rajawali Hitam; masukkan ke dilewati. "Triplek Sengon" = Triplek. Gypsum, List Granit, kran, selang, PVC pipa = dilewati.\n' +
      'Toko: nama customer di nota tanpa nama (kosong) isi toko_buku "" dan toko null.\n' +
      'Cocokkan nama customer ke SATU nama dari DAFTAR TOKO di bawah (huruf besar kecil dan awalan TK., TB., CV., UD. boleh beda). Jika tidak ada yang cocok, isi "toko" dengan null dan tetap isi "toko_buku" persis seperti tertulis.\n' +
      'Pemetaan yang sudah dikoreksi sebelumnya (nama di buku => nama toko):\n' + (alias || '(belum ada)') + '\n\n' +
      'DAFTAR TOKO:\n' + names + '\n\n' +
      'Tanggal: tanggal hanya ditulis di kolom Hari & Tanggal pada nota pertama hari itu (contoh "Selasa 17/26/11" = 17 November 2026). Jika di foto tidak ada tanggal, isi tanggal null.\n' +
      'Jawab HANYA JSON, tanpa teks lain, bentuk:\n' +
      '{"baris":[{"tanggal":"YYYY-MM-DD atau null","nota":angka atau null,"tp":false,"toko_buku":"tertulis di buku","toko":"nama dari daftar atau null","merek":"Aurora|Infiniti|Granito|Rajawali|Sealant|ACP|Triplek|Shera","barang":"nama barang tertulis","jumlah":angka,"ragu":false}],"dilewati":["nama barang merek lain, tanpa duplikat"],"catatan":"hal yang perlu dicek, atau kosong"}\n' +
      'Isi "ragu": true bila angka atau tulisan sulit dibaca. Jangan menebak angka. Jika nomor nota diberi label TP, isi "tp": true.';
    try {
      const res = await sample.json(prompt, { images: list, modelTier: 'complex', signal: ctrl.signal, cache: false });
      const rows = (res && Array.isArray(res.baris) ? res.baris : []).map((r, i) => {
        const tb = String(r.toko_buku || '').trim();
        let toko = r.toko && tokoOK(r.toko) ? r.toko : (S.alias[tb.toLowerCase()] && tokoOK(S.alias[tb.toLowerCase()]) ? S.alias[tb.toLowerCase()] : '');
        return { _u: Date.now() + '_' + i, tanggal: S.scanTgl || (/^\d{4}-\d{2}-\d{2}$/.test(r.tanggal || '') ? r.tanggal : todayISO), nota: r.nota == null ? null : r.nota, tp: !!r.tp, toko_buku: tb, toko, merek: MK.includes(r.merek) ? r.merek : 'Aurora', barang: r.barang || '', jumlah: r.merek === 'Sealant' ? Math.round((Number(r.jumlah) || 0) / 24 * 100) / 100 : Number(r.jumlah) || 0, ragu: !!r.ragu || (!r.tanggal && !S.scanTgl) };
      });
      sc.rows = rows; sc.skipped = Array.isArray(res && res.dilewati) ? res.dilewati.map(String) : []; sc.note = String((res && res.catatan) || ''); sc.phase = 'review';
    } catch (e) {
      sc.phase = 'idle';
      if (!(e && e.code === 'cancelled')) sc.err = (e && e.userMsg) || ('Foto belum bisa dibaca (' + ((e && (e.code || e.message)) || 'galat') + '). Coba foto lain atau ulangi.');
    }
    ctrl = null;
    render();
  }

  /* ---------- baca file Excel, CSV, PDF ---------- */
  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  const PDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDFW_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const libs = {};
  const loadLib = (src) => libs[src] || (libs[src] = new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => { delete libs[src]; rej(new Error('lib')); }; document.head.appendChild(el); }));
  const isoOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const cs = (v) => (v instanceof Date ? isoOf(new Date(v.getTime() + 43200000)) : String(v == null ? '' : v).replace(/\s+/g, ' ').trim());
  const BLNX = { jan: 1, feb: 2, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, agu: 8, agt: 8, aug: 8, sep: 9, okt: 10, oct: 10, nov: 11, des: 12, dec: 12 };
  function toISO(v, yr) {
    if (v instanceof Date) return isNaN(v) ? '' : isoOf(new Date(v.getTime() + 43200000));
    if (typeof v === 'number') { if (v > 30000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); } return ''; }
    const t = cs(v); let m;
    const mk = (y, mo, d) => { y = Number(y || yr); if (y < 100) y += 2000; mo = Number(mo); d = Number(d); return mo >= 1 && mo <= 12 && d >= 1 && d <= 31 ? y + '-' + pad2(mo) + '-' + pad2(d) : ''; };
    if ((m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) return mk(m[1], m[2], m[3]);
    if ((m = t.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})(?:\s*[\/\-.]\s*(\d{2,4}))?/))) return mk(m[3], m[2], m[1]);
    if ((m = t.match(/(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\.?\s*(\d{2,4})?/)) && BLNX[m[2].toLowerCase()]) return mk(m[3], BLNX[m[2].toLowerCase()], m[1]);
    return '';
  }
  function num(v) {
    if (typeof v === 'number') return v;
    let t = cs(v).replace(/\s/g, '');
    if (!t) return 0;
    if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, '');
    else t = t.replace(',', '.');
    const n = parseFloat(t);
    return isFinite(n) ? n : 0;
  }
  const HDR = [
    ['barang', /barang|item|produk|deskripsi|description|nama\s*brg/i],
    ['tanggal', /tgl|tanggal|date|hari/i],
    ['nota', /nota|faktur|invoice|no\.?\s*(bukti|trans|inv)/i],
    ['toko', /customer|pelanggan|toko|outlet|pembeli|nama\s*cust/i],
    ['q1', /qty|kuantitas|quantity|banyak|jml|^l$/i],
    ['q2', /^k$/i],
  ];
  const hdrKey = (t) => { if (!t || t.length > 30) return null; for (const [k, re] of HDR) if (re.test(t)) return k; return null; };
  function guessMap(table) {
    let best = { head: -1, map: {}, hit: 0 };
    for (let r = 0; r < Math.min(table.length, 60); r++) {
      const map = {}; let hit = 0;
      table[r].forEach((c, i) => { const k = hdrKey(cs(c)); if (k && map[k] == null) { map[k] = i; hit++; } });
      if (hit > best.hit) best = { head: r, map, hit };
    }
    if (best.hit < 2) return { head: -1, map: {} };
    if (best.map.q1 == null) { const i = table[best.head].findIndex((c) => /jumlah/i.test(cs(c))); if (i >= 0) best.map.q1 = i; }
    return best;
  }
  function merekOf(t) {
    if (/rajawali/i.test(t)) return /acetic|neutral|netral|sealant|sealand|silicon/i.test(t) ? { k: 'Sealant' } : { k: 'Rajawali', ragu: !/hitam/i.test(t) };
    if (/\baurora\b/i.test(t)) return { k: 'Aurora' };
    if (/\binfiniti\b/i.test(t)) return { k: 'Infiniti' };
    if (/\bgranito\b/i.test(t)) return { k: 'Granito' };
    if (/triplek|plywood/i.test(t)) return { k: 'Triplek' };
    if (/\bshera\b/i.test(t)) return { k: 'Shera' };
    if (/\bACP\b|\b[AB]A\s+(F?PE|HDPE|PVDF)\b/i.test(t)) return { k: 'ACP', ragu: true };
    return null;
  }
  const normA = (t) => String(t).toUpperCase().replace(/\((T|L|CL|C|K)\)/g, ' ').replace(/\b(TK|TB|CV|UD|PT|TOKO)\b\.?/g, ' ').replace(/[^A-Z0-9]+/g, '');
  const normB = (t) => normA(String(t).replace(/\([^)]*\)/g, ' '));
  function matchToko(buku) {
    const al = S.alias[buku.trim().toLowerCase()];
    if (al && tokoOK(al)) return al;
    for (const f of [normA, normB]) {
      const key = f(buku);
      if (!key) continue;
      const hit = S.toko.filter((t) => f(t.toko) === key);
      if (hit.length === 1) return hit[0].toko;
    }
    return '';
  }

  async function sheetTable(buf, ext) {
    await loadLib(XLSX_URL);
    const wb = window.XLSX.read(buf, ext === 'csv' ? { type: 'array', raw: true } : { type: 'array', cellDates: true });
    let best = [];
    wb.SheetNames.forEach((n) => { const t = window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '', blankrows: false }); if (t.length > best.length) best = t; });
    return best;
  }
  async function pdfTable(buf) {
    await loadLib(PDFW_URL); await loadLib(PDF_URL);
    const lib = window.pdfjsLib;
    try { lib.GlobalWorkerOptions.workerSrc = PDFW_URL; } catch (e) {}
    const pdf = await lib.getDocument({ data: buf, isEvalSupported: false }).promise;
    const lines = []; let chars = 0;
    for (let p = 1; p <= pdf.numPages; p++) {
      const tc = await (await pdf.getPage(p)).getTextContent();
      const its = tc.items.filter((i) => i.str && i.str.trim()).map((i) => ({ x: i.transform[4], y: i.transform[5], w: i.width, h: i.height || 10, s: i.str.trim() }));
      its.sort((a, b) => b.y - a.y || a.x - b.x);
      let cur = null;
      its.forEach((it) => { chars += it.s.length; if (!cur || Math.abs(cur.y - it.y) > Math.max(2.5, it.h * .4)) { cur = { y: it.y, items: [] }; lines.push(cur); } cur.items.push(it); });
    }
    if (chars < 40) { const e = new Error('scan'); e.userMsg = 'PDF ini tidak berisi teks (hasil scan atau foto), jadi tidak bisa dibaca di sini. Kirim fotonya ke chat Claude.'; throw e; }
    lines.forEach((L) => {
      L.items.sort((a, b) => a.x - b.x); L.cells = [];
      L.items.forEach((it) => { const last = L.cells[L.cells.length - 1]; const gap = last ? it.x - (last.x + last.w) : 99; if (last && gap < Math.max(4, it.h * .45)) { last.s += (gap > 1 ? ' ' : '') + it.s; last.w = it.x + it.w - last.x; } else L.cells.push({ x: it.x, w: it.w, s: it.s }); });
    });
    let hi = -1, hb = 1;
    lines.slice(0, 80).forEach((L, i) => { const n = new Set(L.cells.map((c) => hdrKey(c.s)).filter(Boolean)).size; if (n > hb) { hb = n; hi = i; } });
    if (hi < 0) return lines.map((L) => L.cells.map((c) => c.s));
    const H = lines[hi].cells;
    const colOf = (c) => { let b = 0, bd = Infinity; H.forEach((h, i) => { const d = Math.min(Math.abs(c.x - h.x), Math.abs(c.x + c.w - (h.x + h.w)), Math.abs(c.x + c.w / 2 - (h.x + h.w / 2))); if (d < bd) { bd = d; b = i; } }); return b; };
    const table = [H.map((c) => c.s)];
    lines.slice(hi + 1).forEach((L) => { const row = H.map(() => ''); L.cells.forEach((c) => { const i = colOf(c); row[i] = row[i] ? row[i] + ' ' + c.s : c.s; }); table.push(row); });
    return table;
  }

  async function readFile(file) {
    const sc = S.scan;
    sc.err = ''; sc.phase = 'busy'; sc.msg = 'Membaca ' + (file.name || 'file') + '…'; render();
    try {
      const name = file.name || 'file', ext = (name.split('.').pop() || '').toLowerCase();
      const buf = await file.arrayBuffer();
      let table = ext === 'pdf' || file.type === 'application/pdf' ? await pdfTable(buf) : await sheetTable(buf, ext);
      table = table.filter((r) => r.some((c) => cs(c)));
      if (table.length < 2) throw new Error('kosong');
      const g = guessMap(table);
      S.imp = { name, table, head: g.head, map: g.map, tgl: S.ym === todayYM ? todayISO : S.ym + '-01' };
      sc.phase = 'map';
    } catch (e) {
      sc.phase = 'idle';
      sc.err = (e && e.userMsg) || (e && e.message === 'lib' ? 'Pembaca file gagal dimuat. Periksa koneksi internet, lalu coba lagi.' : 'File belum bisa dibaca. Pakai Excel, CSV, atau PDF yang berisi teks.');
    }
    sc.msg = '';
    render();
  }

  function processFile() {
    const im = S.imp, m = im.map, yr = S.ym.slice(0, 4);
    const cell = (row, k) => (m[k] == null ? '' : row[m[k]]);
    const cur = { tgl: '', nota: '', toko: '' };
    const agg = new Map(), skipped = new Set();
    let seq = 0;
    for (let r = im.head + 1; r < im.table.length; r++) {
      const row = im.table[r];
      const br = cs(cell(row, 'barang')), tk = cs(cell(row, 'toko')), nt = cs(cell(row, 'nota'));
      if (hdrKey(br) === 'barang' && br.length < 20) continue; // judul kolom yang berulang di tiap halaman
      const tg = toISO(cell(row, 'tanggal'), yr);
      if (tg) cur.tgl = tg;
      if (nt) cur.nota = nt;
      if (tk) cur.toko = tk;
      if (!br) continue;
      const mk = merekOf(br);
      if (!mk) { if (skipped.size < 30) skipped.add(br.slice(0, 40)); continue; }
      let q = num(cell(row, 'q1')) || num(cell(row, 'q2'));
      if (mk.k === 'Sealant') q = Math.round(q / 24 * 100) / 100; // 1 dus = 24 pcs
      if (!(q > 0) || !cur.toko) continue;
      const key = cur.nota ? [cur.nota, mk.k, cur.toko].join('|') : 'x' + (seq++);
      const o = agg.get(key);
      if (o) { o.jumlah += q; o.barang += ', ' + br; o.ragu = o.ragu || !!mk.ragu; continue; }
      const nn = (cur.nota.match(/(\d+)\D*$/) || [])[1];
      agg.set(key, { _u: Date.now() + '_f' + agg.size, tanggal: cur.tgl || im.tgl, nota: nn == null ? null : Number(nn), tp: /\bTP\b/i.test(cur.nota), toko_buku: cur.toko, toko: matchToko(cur.toko), merek: mk.k, barang: br, jumlah: q, ragu: !!mk.ragu || !cur.tgl, sumber: 'File: ' + im.name.slice(0, 60) });
    }
    const rows = [], luar = []; let sama = 0;
    agg.forEach((r) => {
      if (!r.toko) { luar.push(r); return; }
      const ex = S.nota.find((n) => n.id === rowId(r));
      if (ex && ex.toko === r.toko && Number(ex.jumlah) === r.jumlah) { sama++; return; }
      rows.push(r);
    });
    S.scan = { phase: 'review', rows, luar, sama, skipped: Array.from(skipped), note: 'Dari file ' + im.name + '.', err: '', files: 1 };
    S.imp = null;
    render(); window.scrollTo(0, 0);
  }

  /* ---------- PDF ---------- */
  async function exportPDF() {
    if (!window.jspdf) { toast('PDF belum siap, coba lagi'); return; }
    let dl = null;
    try { dl = await claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) { toast('Unduh belum tersedia di tampilan ini'); return; }
    const c = calc();
    const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
    const PW = 595, PH = 842, M = 40, CW = PW - M * 2;
    let y = 50;
    const need = (h) => { if (y + h > PH - 45) { doc.addPage(); y = 50; } };
    const font = (size, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); };
    const put = (s, x, o) => doc.text(String(s), x, y, o);
    const para = (s, size, bold, gap) => { font(size, bold); doc.splitTextToSize(String(s), CW).forEach((l) => { need(size + 4); put(l, M); y += size + 4; }); y += gap || 0; };
    const head = (s) => { need(40); y += 10; font(12, true); put(s, M); y += 6; doc.setDrawColor(200); doc.line(M, y, PW - M, y); y += 16; };
    const sg = (d) => (d >= 0 ? '+' : '-') + fmt(Math.abs(d));

    font(18, true); put('Rekap Penjualan Roven', M); y += 20;
    font(10, false); put('Periode ' + ymLabel(S.ym) + '  |  dicetak ' + dLabel(todayISO), M); y += 14;
    put(fmt(c.notas.length) + ' nota  |  ' + fmt(c.sudah.size) + ' dari ' + fmt(S.toko.length) + ' toko kunjungan sudah order', M); y += 10;

    head('Total per merek');
    font(9, true);
    [['Merek', M, 'left'], ['Total', 230, 'right'], ['Target', 300, 'right'], ['Tercapai', 375, 'right'], [ymLabel(c.pym), 460, 'right'], ['Selisih', PW - M, 'right']].forEach(([s, x, al]) => put(s, x, { align: al }));
    y += 15;
    const butuh = [];
    MEREK.forEach((m) => {
      need(16); font(10, false);
      const t = Number(c.tgt[m.k]) || 0, tot = c.tot[m.k] || 0, pv = c.ptot[m.k] || 0;
      put(m.n, M); put(fmt(tot), 230, { align: 'right' }); put(t ? fmt(t) : '-', 300, { align: 'right' }); put(t ? pf(tot / t) : '-', 375, { align: 'right' });
      put(c.pHas ? fmt(pv) : '-', 460, { align: 'right' }); put(c.pHas ? sg(tot - pv) : '-', PW - M, { align: 'right' });
      y += 16;
      const hr = sisaHari(S.ym);
      if (t && tot < t && hr) butuh.push(m.n + ' ' + fmt(Math.ceil((t - tot) / hr / 5) * 5));
    });
    y += 4;
    if (butuh.length) para('Kebutuhan per hari (sisa ' + sisaHari(S.ym) + ' hari kerja, Senin-Sabtu): ' + butuh.join(', '), 9.5, false, 2);
    if (c.pHas && S.ym === todayYM) para('Catatan: ' + ymLabel(S.ym) + ' masih berjalan, dibanding ' + ymLabel(c.pym) + ' sebulan penuh.', 8.5, false, 0);

    const sudahL = S.toko.filter((t) => c.sudah.has(t.toko));
    head('Toko sudah order (' + sudahL.length + ' dari ' + S.toko.length + ')');
    sudahL.forEach((t) => {
      const p = c.perToko[t.toko];
      para(t.toko + ' (Kunj. ' + t.k + '): ' + MK.filter((k) => p[k]).map((k) => mInfo(k).n + ' ' + fmt(p[k])).join(', '), 9.5, false, 2);
    });
    if (!sudahL.length) para('Belum ada.', 9.5, false, 0);

    const belumL = S.toko.filter((t) => !c.sudah.has(t.toko));
    head('Toko belum order (' + belumL.length + ')');
    Array.from(new Set(S.toko.map((t) => t.k))).sort((a, b) => a - b).forEach((k) => {
      const names = belumL.filter((t) => t.k === k).map((t) => t.toko);
      if (names.length) para('Kunjungan ' + k + ': ' + names.join(', '), 9.5, false, 4);
    });

    head('Daftar nota (' + c.notas.length + ')');
    c.notas.slice().sort((a, b) => (a.tanggal < b.tanggal ? -1 : a.tanggal > b.tanggal ? 1 : Number(a.nota) - Number(b.nota))).forEach((n) => {
      para(dLabel(n.tanggal) + '  |  nota ' + (n.nota == null ? '-' : n.nota) + (n.jenis ? ' (' + n.jenis + ')' : '') + '  |  ' + n.toko + '  |  ' + mInfo(n.merek).n + ' ' + fmt(n.jumlah), 9, false, 1);
    });

    const np = doc.getNumberOfPages();
    for (let i = 1; i <= np; i++) { doc.setPage(i); font(8, false); doc.setTextColor(120); doc.text('Rekap Penjualan Roven - ' + ymLabel(S.ym) + ' - halaman ' + i + ' dari ' + np, PW / 2, PH - 24, { align: 'center' }); }
    try {
      await dl.save({ filename: 'Rekap-Roven-' + S.ym + '.pdf', data: doc.output('blob') });
      toast('PDF tersimpan');
    } catch (e) {
      if (!(e && e.code === 'declined')) toast('PDF gagal diunduh');
    }
  }

  /* ---------- aksi ---------- */
  async function onAction(a, b) {
    const d = b.dataset;
    if (a === 'tab') { S.tab = d.t; render(); window.scrollTo(0, 0); }
    else if (a === 'prev') { S.ym = ymShift(S.ym, -1); render(); }
    else if (a === 'next') { S.ym = ymShift(S.ym, 1); render(); }
    else if (a === 'belum') { S.tab = 'toko'; S.belum = true; S.grup = 'all'; render(); window.scrollTo(0, 0); }
    else if (a === 'belumToggle') { S.belum = !S.belum; render(); }
    else if (a === 'grup') { S.grup = d.g; render(); }
    else if (a === 'areaToggle') { S.tutup[d.g] = !S.tutup[d.g]; drawTokoList(); }
    else if (a === 'toko') sheetToko(d.n);
    else if (a === 'nota') sheetNota(d.id);
    else if (a === 'close') closeSheet();
    else if (a === 'merek') sheetMerek(d.k);
    else if (a === 'target') sheetTarget(d.k);
    else if (a === 'targetSave') {
      const doc = { ym: S.ym };
      document.querySelectorAll('[data-tk]').forEach((el) => { const v = Number(el.value); if (v > 0) doc[el.dataset.tk] = v; });
      try { await write(() => S.db.doc('target/' + S.ym).set(doc)); closeSheet(); toast('Target tersimpan'); } catch (e) { toast('Gagal menyimpan target'); }
    }
    else if (a === 'notaSave') {
      const old = S.nota.find((x) => x.id === d.id);
      const r = { _u: 'e', tanggal: $('#e-tanggal').value, nota: $('#e-nota').value, tp: $('#e-tp').checked, toko: $('#e-toko').value, toko_buku: old ? old.toko_buku : '', merek: $('#e-merek').value, jumlah: $('#e-jumlah').value, sumber: old ? old.sumber : 'Manual' };
      if (!tokoOK(r.toko) || !(Number(r.jumlah) > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(r.tanggal)) { toast('Periksa toko, jumlah, dan tanggal'); return; }
      const nid = rowId(r);
      try {
        await write(() => S.db.doc('nota/' + nid).set(docOf(r)));
        if (nid !== d.id) await write(() => S.db.doc('nota/' + d.id).delete());
        closeSheet(); toast('Nota diperbarui');
      } catch (e) { toast('Gagal menyimpan'); }
    }
    else if (a === 'notaDel') {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Ketuk lagi untuk menghapus'; return; }
      try { await write(() => S.db.doc('nota/' + d.id).delete()); closeSheet(); toast('Nota dihapus'); } catch (e) { toast('Gagal menghapus'); }
    }
    else if (a === 'manual' || a === 'addFor') {
      const r = { _u: Date.now() + '_m', tanggal: S.ym === todayYM ? todayISO : S.ym + '-01', nota: null, tp: false, toko_buku: '', toko: a === 'addFor' ? d.n : '', merek: 'Aurora', barang: '', jumlah: 0, ragu: false, sumber: 'Manual' };
      if (S.scan.phase !== 'review') S.scan = { phase: 'review', rows: [], skipped: [], note: '', err: '', files: 0 };
      S.scan.rows.push(r); S.tab = 'foto'; closeSheet(); render(); window.scrollTo(0, document.body.scrollHeight);
    }
    else if (a === 'rowDel') { S.scan.rows.splice(Number(d.i), 1); render(); }
    else if (a === 'scanReset') { S.imp = null; S.scan = { phase: 'idle', rows: [], skipped: [], note: '', err: '', files: 0 }; render(); }
    else if (a === 'scanCancel') { if (ctrl) ctrl.abort(); }
    else if (a === 'scanSave') saveRows();
    else if (a === 'impGo') { if (S.imp) processFile(); }
    else if (a === 'luarShow') { S.scan.rows.push(...(S.scan.luar || [])); S.scan.luar = []; render(); }
    else if (a === 'pdf') exportPDF();
    else if (a === 'tglSet') { S.scanTgl = d.v || ''; render(); }
    else if (a === 'backup') { try { await window.rekapLocal.backup(); } catch (e) { toast('Cadangan gagal dibuat'); } }
  }

  document.addEventListener('click', (e) => {
    if (e.target === $('#scrim')) { closeSheet(); return; }
    const b = e.target.closest('[data-a]');
    if (b) onAction(b.dataset.a, b);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'q') { S.q = e.target.value; drawTokoList(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'file' && t.files && t.files.length) { const fs = Array.from(t.files); if (fs.every((f) => /^image\//.test(f.type))) scan(fs); else readFile(fs.find((f) => !/^image\//.test(f.type))); return; }
    if (t.dataset && t.dataset.mk && S.imp) { S.imp.map[t.dataset.mk] = t.value === '' ? null : Number(t.value); render(); return; }
    if (t.id === 'imp-tgl' && S.imp) { S.imp.tgl = t.value; return; }
    if (t.id === 'scanTgl') { S.scanTgl = t.value; render(); return; }
    if (t.id === 'apiKey') { window.rekapLocal.setKey(t.value); S.keyOpen = false; toast(t.value.trim() ? 'Kunci tersimpan' : 'Kunci dihapus'); render(); return; }
    if (t.id === 'apiModel') { window.rekapLocal.setModel(t.value); toast('Model disimpan'); return; }
    if (t.id === 'restoreFile' && t.files && t.files[0]) {
      t.files[0].text().then((txt) => { window.rekapLocal.restore(JSON.parse(txt)); toast('Data dipulihkan'); }).catch(() => toast('File ini bukan cadangan Rekap Roven'));
      return;
    }
    const f = t.dataset && t.dataset.f;
    const card = t.closest && t.closest('[data-i]');
    if (f && card) {
      const r = S.scan.rows[Number(card.dataset.i)];
      if (!r) return;
      r[f] = f === 'tp' ? t.checked : f === 'jumlah' ? Number(t.value) : f === 'nota' ? (t.value === '' ? null : Number(t.value)) : t.value;
      if (f === 'toko' || f === 'jumlah' || f === 'tanggal') r.ragu = false;
      render();
    }
  });

  /* ---------- mulai ---------- */
  async function init() {
    render();
    let db = null;
    try { db = await claude.use('db'); } catch (e) { db = null; }
    if (!db) { S.offline = true; render(); return; }
    S.db = db;
    const bad = () => {};
    db.doc('config/toko').onSnapshot((s) => { const v = s.exists ? s.data() : null; S.toko = v && Array.isArray(v.list) ? v.list : []; render(); }, bad);
    db.doc('config/alias').onSnapshot((s) => { const v = s.exists ? s.data() : null; S.alias = v && v.map ? v.map : {}; }, bad);
    db.collection('nota').onSnapshot((s) => { S.nota = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); render(); }, bad);
    db.collection('target').onSnapshot((s) => { S.target = {}; s.docs.forEach((d) => { S.target[d.id] = d.data(); }); render(); }, bad);
  }
  init();
})();
</script>
</body>
</html>
